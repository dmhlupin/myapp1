<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Редактировать пользователя</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f0f2f5;
            padding: 40px 20px;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
        }
        
        .back-link {
            color: #667eea;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid #667eea;
            border-radius: 6px;
            transition: all 0.2s;
        }
        
        .back-link:hover {
            background: #667eea;
            color: white;
        }
        
        .id-badge {
            display: inline-block;
            background: #edf2f7;
            color: #4a5568;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        
        .help-text {
            font-size: 13px;
            color: #a0aec0;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ Редактировать пользователя</h1>
            <a href="/admin" class="back-link">← Назад</a>
        </div>

        <div style="margin-bottom: 20px;">
            <span class="id-badge">ID: {{id}}</span>
            <input type="hidden" id="userId" value="{{id}}">
        </div>

        <form id="editUserForm" onsubmit="submitForm(event)">
            <div class="form-group">
                <label>Логин <span class="required">*</span></label>
                <input type="text" id="username" required value="{{username}}">
                <div class="help-text">Уникальный логин для входа</div>
            </div>

            <div class="form-group">
                <label>Email <span class="required">*</span></label>
                <input type="email" id="email" required value="{{email}}">
                <div class="help-text">Уникальный email адрес</div>
            </div>

            <div class="form-group">
                <label>ФИО</label>
                <input type="text" id="full_name" value="{{full_name}}">
            </div>

            <div class="form-group">
                <label>Отдел</label>
                <input type="text" id="department" value="{{department}}">
            </div>

            <div class="form-group">
                <label>Телефон</label>
                <input type="text" id="phone" value="{{phone}}">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="submitBtn">💾 Обновить</button>
                <a href="/admin" class="btn btn-back">Отмена</a>
            </div>
        </form>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        const userId = parseInt(document.getElementById('userId').value);

        async function submitForm(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Обновление...';

            const formData = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                full_name: document.getElementById('full_name').value.trim(),
                department: document.getElementById('department').value.trim(),
                phone: document.getElementById('phone').value.trim()
            };

            try {
                const response = await fetch(`/api/admin/users/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    showToast('✅ Пользователь успешно обновлен!', 'success');
                    setTimeout(() => {
                        window.location.href = '/admin';
                    }, 1500);
                } else {
                    showToast('❌ ' + result.error, 'error');
                    submitBtn.disabled = false;
                    submitBtn.textContent = '💾 Обновить';
                }
            } catch (error) {
                showToast('❌ Ошибка при обновлении пользователя', 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = '💾 Обновить';
            }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => {
                    container.removeChild(toast);
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
