<!-- views/admin-user-edit.html -->
<!-- Контент-шаблон страницы редактирования пользователя -->

<div class="page-header">
  <div>
    <h1 class="page-title">✏️ Редактировать пользователя</h1>
    <div class="page-subtitle">ID: {{id}}</div>
  </div>
  <div class="page-actions">
    <a href="/admin" class="btn btn-ghost btn-sm">← Назад</a>
  </div>
</div>

<!-- Скрытые поля -->
<input type="hidden" id="userId" value="{{id}}">
<input type="hidden" id="currentRole" value="{{role}}">

<div class="info-box">
  <span class="info-box-icon">💡</span>
  <p>Пароль нельзя изменить здесь. Для сброса пароля используйте кнопку 🔑 в списке пользователей.</p>
</div>

<form id="editUserForm" onsubmit="submitForm(event)">

  <div class="card">
    <div class="card-header">
      <h2 class="card-title">👤 Учётные данные</h2>
    </div>
    <div class="card-body">

      <div class="form-group">
        <label>Логин <span class="required">*</span></label>
        <input type="text" id="username" required value="{{username}}">
      </div>

      <div class="form-group">
        <label>Email <span class="required">*</span></label>
        <input type="email" id="email" required value="{{email}}">
      </div>

      <div class="form-group">
        <label>ФИО</label>
        <input type="text" id="full_name" value="{{full_name}}">
      </div>

      <div class="form-group">
        <label>Отдел</label>
        <input type="text" id="department" value="{{department}}">
      </div>

      <div class="form-group">
        <label>Телефон</label>
        <input type="text" id="phone" value="{{phone}}">
      </div>

      <div class="form-group">
        <label>Роль</label>
        <select id="role">
          <option value="user">👤 Пользователь</option>
          <option value="admin">👑 Администратор</option>
        </select>
        <div class="help-text">Администратор имеет полный доступ к системе</div>
      </div>

    </div>
  </div>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary" id="submitBtn">💾 Сохранить</button>
    <a href="/admin" class="btn btn-ghost">Отмена</a>
  </div>

</form>
