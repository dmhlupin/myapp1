<!-- Заголовок страницы -->
<div class="page-header">
    <div>
        <h1 class="page-title">📑 PDF инструкции</h1>
        <div class="page-subtitle">Документация и руководства пользователя</div>
    </div>
    <div class="page-actions">
        <a href="/profile" class="btn btn-ghost btn-sm">← На главную</a>
    </div>
</div>

<!-- Список PDF -->
<div class="pdf-list">
    {{#each pdfLinks}}
        <div class="pdf-item">
            <div class="info">
                <span class="icon">📄</span>
                <div>
                    <div class="name">{{this.name}}</div>
                    <div class="filename">{{this.file}}</div>
                </div>
            </div>
            <a href="/pdf/{{this.file}}" target="_blank" class="download-link">
                📥 Открыть
            </a>
        </div>
    {{/each}}
</div>

<!-- Info-box -->
<div class="info-box">
    <strong>ℹ️ Информация:</strong>
    Для реальной генерации PDF используйте библиотеки
    <code>pdfkit</code> или <code>puppeteer</code>
</div>
