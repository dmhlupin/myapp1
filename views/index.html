<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/main-page.css">
    <link rel="stylesheet" href="/css/help.css">
</head>
<body>
    <div class="main-container">
        <div class="main-card">
            <!-- Шапка с информацией о пользователе -->
            <div class="user-badge">
                <a href="/profile" class="user-link" title="Личный кабинет">
                    👤 <span id="userName">{{userName}}</span>
                </a>
                <a href="/logout" class="user-link logout" title="Выйти">🚪 Выйти</a>
            </div>
            
            <h1 class="main-title">🚀 Учет техники</h1>
            <p class="main-subtitle">Система управления техникой и пользователями</p>
            
            <div class="main-sections">
                <a href="/users" class="link-card users">
                    <span class="icon">👥</span>
                    <div class="title">Учет пользователей</div>
                    <div class="description">Просмотр всех пользователей и их техники</div>
                </a>
                
                <a href="/equipment" class="link-card equipment">
                    <span class="icon">🔧</span>
                    <div class="title">Учет техники</div>
                    <div class="description">Просмотр всей техники и ее статуса</div>
                </a>
            </div>
            
            <!-- Справочный раздел -->
            <div class="reference-section" style="margin-top: 20px;">
                <div class="reference-title">
                    <span class="icon">📚</span>
                    Справочная информация
                    <span style="font-weight: 400; font-size: 13px; color: #a0aec0; margin-left: auto;">
                        Для пользователей
                    </span>
                </div>
                <div class="reference-links">
                    <a href="/pdf" class="reference-link">
                        <span class="icon">📑</span>
                        Инструкции и документация
                        <span class="badge">PDF</span>
                    </a>
                    <button onclick="showHelpModal()" class="reference-link" style="border: none; cursor: pointer; font-family: inherit;">
                        <span class="icon">❓</span>
                        Помощь
                        <span class="badge">FAQ</span>
                    </button>
                </div>
            </div>
            


    

    <script src="/js/main.js"></script>
    <script src="/js/help.js"></script>
    <script src="/js/footer.js"></script>
    <script src="/js/main-page.js"></script>
</body>
</html>
